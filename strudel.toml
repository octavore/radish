[app]
name         = "Radish"
bundle_id    = "com.breakfastlabs.radish"
version      = "0.1.0"
build_number = "1"

[build]
info_json_path = "info.json"  # registers the radish:// URL scheme, see open.rs

[build.icon]
src        = "resources/radish.png"
scale      = 1.2
background = "#3d2817"

# The `rd` CLI, built from crates/rd by scripts/build-core.sh. It rides along in
# the bundle so Radish ▸ Install 'rd' Command Line Tool has something to
# symlink into ~/.local/bin (see CLIInstaller).
[[build.copy]]
src      = "target/uniffi/rd"
dest_dir = "Contents/MacOS"
sign     = true
